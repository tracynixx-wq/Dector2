name: Windows desktop build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Package Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Windows installer (artifact)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dector-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
